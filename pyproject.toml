[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lizysdk"
version = "0.3.0"
description = "通用 Python 基础工具包：唯一 ID / trace_id 生成、结构化日志、标准化错误"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "fastapi>=0.100", "flask>=2.0", "httpx>=0.24"]
web = ["fastapi>=0.100", "flask>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lizysdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
